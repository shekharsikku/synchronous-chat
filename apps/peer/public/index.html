<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synchronous Peer</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #fafafa;
        background: radial-gradient(circle at top, #262626 0%, transparent 45%), #0a0a0a;
      }

      .card {
        width: 100%;
        max-width: 560px;
        padding: 40px;
        text-align: center;
        border: 1px solid #262626;
        border-radius: 16px;
        background: rgba(23, 23, 23, 0.8);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        padding: 6px 12px;
        border: 1px solid #262626;
        border-radius: 999px;
        background: #171717;
        color: #d4d4d4;
        font-size: 14px;
        font-weight: 600;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #a3a3a3;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 2.5rem);
        letter-spacing: -0.03em;
      }

      .description {
        margin: 0 auto 28px;
        max-width: 440px;
        color: #a3a3a3;
        line-height: 1.7;
      }

      .details {
        display: grid;
        gap: 12px;
        padding-top: 24px;
        border-top: 1px solid #262626;
      }

      .detail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #a3a3a3;
        font-size: 14px;
      }

      .detail strong {
        color: #e5e5e5;
        font-weight: 500;
      }

      code {
        padding: 4px 8px;
        border-radius: 6px;
        background: #262626;
        color: #d4d4d4;
        font-size: 13px;
      }

      footer {
        margin-top: 28px;
        color: #a3a3a3;
        font-size: 12px;
      }

      footer a {
        font-weight: 500;
        color: #d4d4d4;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="status">
        <span class="status-dot"></span>
        Operational
      </div>

      <h1>Synchronous Peer</h1>

      <p class="description">
        Real-time communication infrastructure for synchronous applications. The server is running and ready to accept
        connections.
      </p>

      <div class="details">
        <div class="detail">
          <span>Service</span>
          <strong>Synchronous Peer</strong>
        </div>

        <div class="detail">
          <span>Protocol</span>
          <strong>HTTP / WebSocket</strong>
        </div>

        <div class="detail">
          <span>Endpoint</span>
          <code>/synchronous/peerjs</code>
        </div>
      </div>

      <footer>
        Synchronous Peer · Built by
        <a href="https://github.com/shekharsikku" target="_blank" rel="noopener noreferrer"> Shekhar Sharma </a>
      </footer>
    </main>
  </body>
</html>
